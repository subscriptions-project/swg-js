name: CI

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the right version of Nodejs
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: npm ci --omit optional

      - name: Check lint & rules
        run: npx gulp check

      - name: Check types
        run: npx tsc --project tsconfig.json

  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the right version of Nodejs
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: npm ci
        env:
          # Download the ChromeDriver matching the runner's preinstalled Chrome
          # so e2e tests keep working when the runner image bumps Chrome.
          DETECT_CHROMEDRIVER_VERSION: 'true'

      - name: E2E Tests
        run: . ./build_and_run_e2e.sh

      - name: Upload e2e VRT baseline
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vrt-baseline
          path: test/e2e/vrt/baseline

      - name: Upload e2e VRT report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vrt-report
          path: vrt-report

  e2e-with-all-experiments-enabled:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the right version of Nodejs
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: npm ci
        env:
          # Download the ChromeDriver matching the runner's preinstalled Chrome
          # so e2e tests keep working when the runner image bumps Chrome.
          DETECT_CHROMEDRIVER_VERSION: 'true'

      - name: E2E Tests with all experiments enabled
        run: . ./build_and_run_e2e.sh all_experiments_enabled

      - name: Upload e2e with all experiments VRT baseline
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: all-experiments-vrt-baseline
          path: test/e2e/vrt/baseline

      - name: Upload e2e with all experiments VRT report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: all-experiments-vrt-report
          path: vrt-report

  binaries:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the right version of Nodejs
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: npm ci

      - name: Build binaries
        run: . ./build_binaries.sh

      - name: Archive binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries
          path: |
            dist/*.js
            dist/*.js.map

  unit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the right version of Nodejs
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: npm ci --omit optional

      - name: Unit Tests
        run: npx gulp unit --headless --coverage

      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        with:
          token: 3bd95ad1-098e-45cc-b6c9-4ead17849c96
          files: ./test/coverage/lcov-unit.info
